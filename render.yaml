services:
  - type: web
    name: mitramaati-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
  - type: web
    name: mitramaati
    runtime: docker
    plan: free
    dockerCommand: sh start_ui.sh
    healthCheckPath: /_stcore/health
    dockerfilePath: ./Dockerfile.ui
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: MITRAMAATI_API
        value: https://mitramaati-api.onrender.com
